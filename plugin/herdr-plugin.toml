id = "orch"
name = "orch"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Routes agent status events to the owning orch pane"
platforms = ["linux", "macos"]

[[actions]]
id = "board"
title = "Open orch board"
contexts = ["pane"]
command = ["python3", "board.py", "--open"]

[[actions]]
id = "board-full"
title = "Orch board, full screen"
contexts = ["pane"]
command = ["python3", "board.py", "--open", "--placement", "overlay"]

[[panes]]
id = "board"
title = "Orch board"
placement = "split"
command = ["python3", "board.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "hook.py"]

[[events]]
on = "pane.closed"
command = ["python3", "hook.py"]
