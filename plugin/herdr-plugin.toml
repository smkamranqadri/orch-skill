id = "orch"
name = "orch"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Routes agent status events to the owning orch pane"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "hook.py"]

[[events]]
on = "pane.closed"
command = ["python3", "hook.py"]
