id = "orch"
name = "Orch board"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Read the active orch run; signal its watcher on agent events."
platforms = ["linux", "macos"]

# Herdr keybindings belong in config.toml, not in plugin manifests.
# The installer/coordinator wires this action with:
# [[keys.command]]
# key = "prefix+o"
# type = "plugin_action"
# command = "orch.board"
# description = "Orch board"
[[actions]]
id = "board"
title = "Open orch board"
contexts = ["pane"]
command = ["python3", "board", "--open"]

[[panes]]
id = "board"
title = "Orch board"
placement = "split"
command = ["python3", "board"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "event-hook.py"]

[[events]]
on = "pane.closed"
command = ["python3", "event-hook.py"]
