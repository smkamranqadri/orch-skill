<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">orch coordinates coding agents</title>
  <desc id="desc">An orch coordinator routes work to Claude Code and Codex workers and tracks them on a project board.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#202c42"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#39c5d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#07101e" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1120" height="390" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="55" r="170" fill="#5264b8" opacity=".11"/>
  <circle cx="145" cy="360" r="170" fill="#1db7c8" opacity=".08"/>
  <text x="58" y="73" fill="#9caed0" font-family="ui-monospace, monospace" font-size="15" letter-spacing="3">HERDR · AGENT COORDINATION</text>
  <text x="58" y="146" fill="#f4f7ff" font-family="Inter, ui-sans-serif, sans-serif" font-size="52" font-weight="700">One coordinator.</text>
  <text x="58" y="204" fill="#f4f7ff" font-family="Inter, ui-sans-serif, sans-serif" font-size="52" font-weight="700">Every worker in view.</text>
  <text x="60" y="247" fill="#acbad2" font-family="Inter, ui-sans-serif, sans-serif" font-size="19">Plan, delegate, review, and route status notices.</text>
  <g filter="url(#shadow)">
    <rect x="645" y="58" width="417" height="276" rx="18" fill="#121c2b" stroke="#52617a"/>
    <path d="M645 104h417" stroke="#35445d"/>
    <circle cx="671" cy="81" r="5" fill="#ef7181"/><circle cx="690" cy="81" r="5" fill="#e6bd65"/><circle cx="709" cy="81" r="5" fill="#64c793"/>
    <text x="742" y="87" fill="#b7c3d8" font-family="ui-monospace, monospace" font-size="14">ORCH BOARD · 2 WORKERS</text>
    <rect x="671" y="124" width="365" height="54" rx="10" fill="#1b2940" stroke="#35445d"/>
    <circle cx="694" cy="151" r="7" fill="#65cf9a"/>
    <text x="714" y="147" fill="#eff4ff" font-family="ui-monospace, monospace" font-size="15">planner</text>
    <text x="714" y="165" fill="#91a2bd" font-family="ui-monospace, monospace" font-size="12">Claude Code · pane · working</text>
    <rect x="671" y="189" width="365" height="54" rx="10" fill="#1b2940" stroke="#35445d"/>
    <circle cx="694" cy="216" r="7" fill="#62c5dc"/>
    <text x="714" y="212" fill="#eff4ff" font-family="ui-monospace, monospace" font-size="15">reviewer</text>
    <text x="714" y="230" fill="#91a2bd" font-family="ui-monospace, monospace" font-size="12">Codex · worktree · done</text>
    <rect x="671" y="259" width="365" height="48" rx="10" fill="#202b40"/>
    <path d="M691 282h14" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"/>
    <text x="718" y="287" fill="#bcc9df" font-family="ui-monospace, monospace" font-size="13">notice routed to owning orch</text>
  </g>
  <path d="M540 153h65M540 214h65" stroke="url(#glow)" stroke-width="2" stroke-dasharray="5 7" opacity=".8"/>
  <circle cx="607" cy="153" r="4" fill="#70c9dc"/><circle cx="607" cy="214" r="4" fill="#8879f3"/>
</svg>
